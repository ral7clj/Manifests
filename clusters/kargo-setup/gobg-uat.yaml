apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gobg-uat
  namespace: flux-system
spec:
  interval: 10s
  url: https://github.com/ral7clj/Manifests.git
  ref:
    branch: stage/uat
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gobg-uat
  namespace: flux-system
spec:
  interval: 10s
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: gobg-uat
  targetNamespace: gobg-uat
  wait: true
