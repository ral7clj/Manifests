apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 10s
  url: https://github.com/ral7clj/Manifests.git
  ref:
    branch: stage/test
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 10s
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: gobg-test
  targetNamespace: gobg-test
  wait: true
  timeout: 10m
  healthChecks:
  - apiVersion: flagger.app/v1beta1
    kind: Canary
    name: gobg
    namespace: gobg-test
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: gobg
  namespace: gobg-test
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobg
  service:
    port: 80
    targetPort: 8080
    gateways:
      - gobg-gateway
      - mesh
    hosts:
      - gobg
      - gobg.gobg-test
      - gobg.gobg-test.svc.cluster.local
  analysis:
    interval: 15s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
  
