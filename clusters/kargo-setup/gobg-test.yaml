apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 10s
  url: https://github.com/ral7clj/Manifests.git
  ref:
    branch: stage/test
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 10s
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: gobg-test
  targetNamespace: gobg-test
  wait: true
  timeout: 10m
  healthChecks:
  - apiVersion: flagger.app/v1beta1
    kind: Canary
    name: gobg
    namespace: gobg-test
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: gobg
  namespace: gobg-test
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobg
  service:
    port: 80
    targetPort: 8080
    gateways:
      - gobg-gateway
      - mesh
    hosts:
      - gobg
      - gobg.gobg-test
      - gobg.gobg-test.svc.cluster.local
  analysis:
    interval: 15s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
    webhooks:
      - name: "kargo-promote-job"
        type: post-rollout
        url: "kubernetes-job://dummy"
        timeout: 5m
        metadata:
          type: "job"
          jobSpec: |
            apiVersion: batch/v1
            kind: Job
            spec:
              backoffLimit: 2
              template:
                spec:
                  serviceAccountName: flagger-promoter-sa
                  restartPolicy: Never
                  containers:
                  - name: kargo-promoter
                    image: bitnami/kubectl:latest
                    command: ["/bin/sh", "-c"]
                    args:
                    - |
                      set -e
                      FREIGHT_ID=$(kubectl get deployment/gobg -n gobg-test -o jsonpath='{.spec.template.metadata.annotations.kargo\.akuity\.io/freight}')
                      if [ -z "$FREIGHT_ID" ]; then
                        exit 1
                      fi
                      cat <<EOF | kubectl apply -f -
                      apiVersion: kargo.akuity.io/v1alpha1
                      kind: Promotion
                      metadata:
                        name: promote-uat-${FREIGHT_ID}
                        namespace: kargo
                      spec:
                        stage: uat
                        freight: ${FREIGHT_ID}
                      EOF
