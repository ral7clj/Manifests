apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://github.com/ral7clj/Manifests.git
  ref:
    branch: stage/test
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gobg-test
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: gobg-test
  targetNamespace: gobg-test
