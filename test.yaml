apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: gobg-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  labels:
    app: gobg
  name: gobg
  namespace: gobg-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gobg
  strategy: {}
  template:
    metadata:
      annotations:
        kustomize.toolkit.fluxcd.io/force: enabled
        kustomize.toolkit.fluxcd.io/ssa: Merge
      labels:
        app: gobg
    spec:
      containers:
      - image: ral7clj/gobg:blue
        name: gobg
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  labels:
    app: gobg
  name: gobg
  namespace: gobg-test
spec:
  ports:
  - name: http
    nodePort: 30081
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: gobg
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: flagger-loadtester
  namespace: gobg-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagger-loadtester
  template:
    metadata:
      annotations:
        kustomize.toolkit.fluxcd.io/force: enabled
        kustomize.toolkit.fluxcd.io/ssa: Merge
      labels:
        app: flagger-loadtester
    spec:
      containers:
      - image: ghcr.io/fluxcd/flagger-loadtester:0.36.0
        imagePullPolicy: IfNotPresent
        name: loadtester
        ports:
        - containerPort: 9090
          name: http
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: flagger-loadtester
  namespace: gobg-test
spec:
  ports:
  - port: 80
    targetPort: 9090
  selector:
    app: flagger-loadtester
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: gobg-gateway
  namespace: gobg-test
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - '*'
    port:
      name: http
      number: 80
      protocol: HTTP
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: gobg
  namespace: gobg-test
spec:
  analysis:
    interval: 15s
    maxWeight: 50
    metrics:
    - interval: 1m
      name: request-success-rate
      thresholdRange:
        min: 99
    stepWeight: 10
    threshold: 5
    webhooks:
    - metadata:
        cmd: hey -z 1m -q 10 -c 2 http://gobg-canary.gobg-test.svc.cluster.local/
        type: cmd
      name: load-test
      timeout: 5s
      type: rollout
      url: http://flagger-loadtester.gobg-test.svc.cluster.local/
  service:
    gateways:
    - gobg-gateway
    - mesh
    hosts:
    - gobg
    - gobg.gobg-test
    - gobg.gobg-test.svc.cluster.local
    port: 80
    targetPort: 8080
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobg
