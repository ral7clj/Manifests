apiVersion: v1
kind: Namespace
metadata:
  name: gobg-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gobg
  name: gobg
  namespace: gobg-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gobg
  strategy: {}
  template:
    metadata:
      labels:
        app: gobg
    spec:
      containers:
      - image: ral7clj/gobg:green
        name: gobg
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gobg
  name: gobg
  namespace: gobg-test
spec:
  ports:
  - nodePort: 30081
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: gobg
  type: NodePort
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: gobg
  namespace: gobg-test
spec:
  analysis:
    interval: 15s
    maxWeight: 50
    metrics:
    - interval: 1m
      name: request-success-rate
      thresholdRange:
        min: 99
    - interval: 1m
      name: request-duration
      thresholdRange:
        max: 500
    stepWeight: 10
    threshold: 5
  interval: 15s
  service:
    gateways:
    - mesh
    port: 8080
    targetPort: 8080
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobg
  threshold: 5
