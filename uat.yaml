apiVersion: v1
kind: Namespace
metadata:
  name: gobg-uat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gobg
  name: gobg
  namespace: gobg-uat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gobg
  strategy: {}
  template:
    metadata:
      labels:
        app: gobg
    spec:
      containers:
      - image: ral7clj/gobg:green
        name: gobg
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gobg
  name: gobg
  namespace: gobg-uat
spec:
  ports:
  - nodePort: 30082
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: gobg
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: gobg-uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagger-loadtester
  template:
    metadata:
      labels:
        app: flagger-loadtester
    spec:
      containers:
      - image: ghcr.io/fluxcd/flagger-loadtester:0.36.0
        imagePullPolicy: IfNotPresent
        name: loadtester
        ports:
        - containerPort: 9090
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: gobg-uat
spec:
  ports:
  - port: 80
    targetPort: 9090
  selector:
    app: flagger-loadtester
