apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: gobg-promote
  namespace: kargo
spec:
  vars:
  - name: sourceRepo
    value: https://github.com/ral7clj/Services.git
  - name: targetRepo
    value: https://github.com/ral7clj/Manifests.git
  - name: sourceBranch
    value: main
  - name: targetBranch

  steps:
  - uses: http
    as: trigger-validation-job
    if: "${{ vars.targetBranch == 'uat' }}"
    config:
      method: POST
      url: https://kubernetes.default.svc/apis/batch/v1/namespaces/kargo/jobs
      insecureSkipTLSVerify: true
      headers:
      - name: Content-Type
        value: application/json
      body: |
        {
          "apiVersion": "batch/v1",
          "kind": "Job",
          "metadata": {
            "name": "gobg-canary-validation",
            "namespace": "kargo"
          },
          "spec": {
            "template": {
              "spec": {
                "serviceAccountName": "kargo-promotion-orchestrator",
                "restartPolicy": "Never",
                "containers": [
                  {
                    "name": "validator",
                    "image": "bitnami/kubectl:latest",
                    "command": ["/bin/sh", "-c"],
                    "args": [
                      "set -e\nwhile true; do\n  PHASE=$(kubectl get canary gobg -n gobg-test -o jsonpath='{.status.phase}' 2>/dev/null || echo 'Unknown')\n  if [ \"$PHASE\" != \"Succeeded\" ] && [ \"$PHASE\" != \"Unknown\" ]; then\n    break\n  fi\n  sleep 10\ndone\nwhile true; do\n  PHASE=$(kubectl get canary gobg -n gobg-test -o jsonpath='{.status.phase}')\n  if [ \"$PHASE\" = \"Succeeded\" ]; then\n    exit 0\n  fi\n  if [ \"$PHASE\" = \"Failed\" ]; then\n    exit 1\n  fi\n  sleep 15\ndone"
                    ]
                  }
                ]
              }
            }
          }
        }
      successExpression: "response.status == 201 || response.status == 409"
      failureExpression: "response.status != 201 && response.status != 409"

  - uses: http
    as: wait-for-validation-job
    if: "${{ vars.targetBranch == 'uat' }}"
    retry:
      timeout: 15m
    config:
      method: GET
      url: https://kubernetes.default.svc/apis/batch/v1/namespaces/kargo/jobs/gobg-canary-validation
      insecureSkipTLSVerify: true
      pollInterval: 15s
      successExpression: "response.status == 200 && 'succeeded' in response.body"
      failureExpression: "response.status != 200 || 'failed' in response.body"

  - uses: http
    as: cleanup-validation-job
    if: "${{ vars.targetBranch == 'uat' }}"
    config:
      method: DELETE
      url: https://kubernetes.default.svc/apis/batch/v1/namespaces/kargo/jobs/gobg-canary-validation?propagationPolicy=Background
      insecureSkipTLSVerify: true
      successExpression: "response.status == 200 || response.status == 404"

  - uses: git-clone
    as: clone-sources
    config:
      repoURL: ${{ vars.sourceRepo }}
      checkout:
      - branch: ${{ vars.sourceBranch }}
        path: ./src

  - uses: git-clone
    as: clone-targets
    config:
      repoURL: ${{ vars.targetRepo }}
      checkout:
      - branch: stage/${{ vars.targetBranch }}
        create: true
        path: ./dst

  - uses: git-clear
    as: clear
    config:
      path: ./dst

  - uses: kustomize-build
    as: build-manifests
    config:
      path: ./src/stages/${{ vars.targetBranch }}
      outPath: ./dst/${{ vars.targetBranch }}.yaml

  - uses: git-commit
    as: commit
    config:
      path: ./dst
      message: "kargo: upgrade manifests for stage ${{ vars.targetBranch }}"

  - uses: git-push
    as: push
    config:
      path: ./dst
      targetBranch: stage/${{ vars.targetBranch }}


      
