apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: gobg-promote
  namespace: kargo
spec:
  vars:
  - name: sourceRepo
    value: https://github.com/ral7clj/Services.git
  - name: targetRepo
    value: https://github.com/ral7clj/Manifests.git
  - name: sourceBranch
    value: main
  - name: targetBranch
  steps:
  - uses: git-clone
    as: clone-sources
    config:
      repoURL: ${{ vars.sourceRepo }}
      checkout:
      - branch: ${{ vars.sourceBranch }}
        path: ./src

  - uses: git-clone
    as: clone-targets
    config:
      repoURL: ${{ vars.targetRepo }}
      checkout:
      - branch: stage/${{ vars.targetBranch }}
        create: true
        path: ./dst

  - uses: git-clear
    as: clear
    config:
      path: ./dst

  - uses: kustomize-build
    as: build-manifests
    config:
      path: ./src/stages/${{ vars.targetBranch }}
      outPath: ./dst/${{ vars.targetBranch }}.yaml

  - uses: git-commit
    as: commit
    config:
      path: ./dst
      message: "kargo: upgrade manifests for stage ${{ vars.targetBranch }}"

  - uses: run
    as: wait-for-flagger-canary
    if: ${{ vars.targetBranch == 'test' }}
    config:
      image: bitnami/kubectl:latest
      command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Flagger to detect the new deployment and start Canary"
        sleep 20
        while true; do
          PHASE=$(kubectl get canary gobg -n gobg-test -o jsonpath='{.status.phase}' 2>/dev/null || echo "Waiting")
          echo "Status Flagger Canary: $PHASE"
          if [ "$PHASE" = "Succeeded" ]; then
            echo "Canary promoted succesfully"
            exit 0
          elif [ "$PHASE" = "Failed" ]; then
            echo "Canary failed"
            exit 1
          fi
          sleep 10
        done  
