apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: gobg-promote
  namespace: kargo
spec:
  vars:
  - name: sourceRepo 
    value: https://github.com/ral7clj/Services.git
  - name: targetRepo 
    value: https://github.com/ral7clj/Manifests.git
  - name: sourceBranch
    value: main
  - name: targetBranch
  steps:
  
  - uses: git-clone
    as: clone-sources
    config:
      repoURL: ${{ vars.sourceRepo }}
      checkout:
      - branch: ${{ vars.sourceBranch }}
        path: ./src


  - uses: git-clone
    as: clone-targets
    config:
      repoURL: ${{ vars.targetRepo }}
      checkout:
      - branch: stage/${{ vars.targetBranch }}
        create: true
        path: ./dst

  - uses: git-clear
    as: clear
    config:
      path: ./dst

 
  - uses: kustomize-build
    as: build-manifests
    config:
      path: ./src/stages/${{ vars.targetBranch }}
      outPath: ./dst/${{ vars.targetBranch }}.yaml

  - uses: git-commit
    as: commit
    config:
      path: ./dst
      messageFromSteps:
      - build-manifests

  - uses: git-push
    as: push
    config:
      path: ./dst
      targetBranch: stage/${{ vars.targetBranch }}

  - uses: http
    config:
      method: POST
      url: http://webhook-receiver.flux-system.svc.cluster.local/4315495f645d7bf402af65742d556afcbed6ea5f14de1da8620d6c3ccf9469ea
      headers:
      - name: Authorization
        value: Bearer ${{ secrets.webhooktoken.token }}
      - name: Content-Type
        value: application/json
      body: |
        ${{ quote({"do":"sync"}) }}
