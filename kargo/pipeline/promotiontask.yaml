apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: gobg-promote
  namespace: kargo
spec:
  vars:
  - name: sourceRepo
    value: https://github.com/ral7clj/Services.git
  - name: targetRepo
    value: https://github.com/ral7clj/Manifests.git
  - name: sourceBranch
    value: main
  - name: targetBranch

  steps:
  - uses: http
    as: wait-for-flagger-canary
    if: "${{ vars.targetBranch == 'uat' }}"
    retry:
      timeout: 15m
    config:
      method: GET
      url: http://prometheus.istio-system.svc.cluster.local:9090/api/v1/query?query=flagger_canary_status{name="gobg",namespace="gobg-test"}
      pollInterval: 15s
      successExpression: "response.status == 200 && '\"1\"' in response.body"
      failureExpression: "response.status != 200 || '\"-1\"' in response.body"

  - uses: git-clone
    as: clone-sources
    config:
      repoURL: ${{ vars.sourceRepo }}
      checkout:
      - branch: ${{ vars.sourceBranch }}
        path: ./src

  - uses: git-clone
    as: clone-targets
    config:
      repoURL: ${{ vars.targetRepo }}
      checkout:
      - branch: stage/${{ vars.targetBranch }}
        create: true
        path: ./dst

  - uses: git-clear
    as: clear
    config:
      path: ./dst

  - uses: kustomize-build
    as: build-manifests
    config:
      path: ./src/stages/${{ vars.targetBranch }}
      outPath: ./dst/${{ vars.targetBranch }}.yaml

  - uses: git-commit
    as: commit
    config:
      path: ./dst
      message: "kargo: upgrade manifests for stage ${{ vars.targetBranch }}"

  - uses: git-push
    as: push
    config:
      path: ./dst
      targetBranch: stage/${{ vars.targetBranch }}
