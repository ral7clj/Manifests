apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: gobg-promote
  namespace: kargo
spec:
  vars:
  - name: sourceRepo
    value: https://github.com/ral7clj/Services.git
  - name: targetRepo
    value: https://github.com/ral7clj/Manifests.git
  - name: sourceBranch
    value: main
  - name: targetBranch
  steps:
  - uses: git-clone
    as: clone-sources
    config:
      repoURL: ${{ vars.sourceRepo }}
      checkout:
      - branch: ${{ vars.sourceBranch }}
        path: ./src

  - uses: git-clone
    as: clone-targets
    config:
      repoURL: ${{ vars.targetRepo }}
      checkout:
      - branch: stage/${{ vars.targetBranch }}
        create: true
        path: ./dst

  - uses: git-clear
    as: clear
    config:
      path: ./dst

  - uses: kustomize-build
    as: build-manifests
    config:
      path: ./src/stages/${{ vars.targetBranch }}
      outPath: ./dst/${{ vars.targetBranch }}.yaml

  - uses: git-commit
    as: commit
    config:
      path: ./dst
      message: "kargo: upgrade manifests for stage ${{ vars.targetBranch }}"
  - uses: http
    as: wait-for-flagger-canary
    if: ${{ vars.targetBranch == 'test' }}
    retry:
      timeout: 10m
    config:
      method: GET
      url: https://kubernetes.default.svc/apis/flagger.app/v1beta1/namespaces/gobg-test/canaries/gobg
      insecureSkipTLSVerify: true
      pollInterval: 15s
      successExpression: "response.body['status']['phase'] == 'Succeeded'"
      failureExpression: "response.body['status']['phase'] == 'Failed'"    