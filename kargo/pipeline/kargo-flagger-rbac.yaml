apiVersion: v1
kind: ServiceAccount
metadata:
  name: flagger-promoter-sa
  namespace: gobg-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flagger-promoter-cluster-role
rules:
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["create"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    resourceNames: ["uat"]
    verbs: ["promote"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flagger-promoter-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flagger-promoter-cluster-role
subjects:
  - kind: ServiceAccount
    name: flagger-promoter-sa
    namespace: gobg-test