apiVersion: v1
kind: ServiceAccount
metadata:
  name: flagger-promoter-sa
  namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flagger-promoter-role
  namespace: kargo
rules:
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["create"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    resourceNames: ["gobg-uat"]
    verbs: ["promote"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flagger-promoter-binding
  namespace: kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flagger-promoter-role
subjects:
  - kind: ServiceAccount
    name: flagger-promoter-sa
    namespace: kargo
---
apiVersion: v1
kind: Secret
metadata:
  name: flagger-promoter-token
  namespace: istio-system
  annotations:
    kubernetes.io/service-account.name: flagger-promoter-sa
type: kubernetes.io/service-account-token
