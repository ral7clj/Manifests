apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-promoter-sa
  namespace: gobg-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-promoter-role
rules:
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["create"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    resourceNames: ["uat"]
    verbs: ["promote"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kargo-promoter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-promoter-role
subjects:
  - kind: ServiceAccount
    name: kargo-promoter-sa
    namespace: gobg-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kargo-promoter-script
  namespace: gobg-test
data:
  kargo-promote: |
    #!/bin/sh
    set -e

    # Query Kargo directly for the active Freight ID on the 'test' stage
    FREIGHT_ID=$(kubectl get stage test -n kargo -o jsonpath='{.status.lastPromotion.freight.name}')

    if [ -z "$FREIGHT_ID" ]; then
      echo "{\"error\": \"Active Freight ID not found on stage test\"}"
      exit 1
    fi

    # Apply the Promotion silently
    cat <<EOF | kubectl apply -f - > /dev/null
    apiVersion: kargo.akuity.io/v1alpha1
    kind: Promotion
    metadata:
      name: promote-uat-${FREIGHT_ID}
      namespace: kargo
    spec:
      stage: uat
      freight: ${FREIGHT_ID}
    EOF

    # Return valid empty JSON to Flagger
    echo "{}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-promoter
  namespace: gobg-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kargo-promoter
  template:
    metadata:
      labels:
        app: kargo-promoter
    spec:
      serviceAccountName: kargo-promoter-sa
      containers:
        - name: loadtester
          image: ghcr.io/fluxcd/flagger-loadtester:0.36.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: scripts
              mountPath: /app/scripts
      volumes:
        - name: scripts
          configMap:
            name: kargo-promoter-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: kargo-promoter
  namespace: gobg-test
spec:
  ports:
    - port: 80
      targetPort: 9090
  selector:
    app: kargo-promoter
