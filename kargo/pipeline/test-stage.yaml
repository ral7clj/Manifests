apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: kargo
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: kargo-demo
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: targetBranch
        value: test
      steps:
      - task:
          name: gobg-promote
        as: promote-to-test

  verification:
    analysisTemplates:
    - name: flagger-canary-check 
      provider:
        http:
          address: https://kubernetes.default.svc/apis/flagger.app/v1beta1/namespaces/gobg-test/canaries/gobg
          insecureSkipTLSVerify: true
          headers:
          - name: Authorization
            value: Bearer /var/run/secrets/kubernetes.io/serviceaccount/token
          successCondition: "response.status == 200 && response.body.status.phase == 'Succeeded'"
          failureCondition: "response.status != 200 || response.body.status.phase == 'Failed'"