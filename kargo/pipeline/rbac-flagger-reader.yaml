apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flagger-canary-reader
  namespace: gobg-test
rules:
- apiGroups: ["flagger.app"]
  resources: ["canaries"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-promoter-flagger-binding
  namespace: gobg-test
subjects:
- kind: ServiceAccount
  name: kargo-promotion-orchestrator
  namespace: kargo
- kind: ServiceAccount
  name: kargo-controller
  namespace: kargo
roleRef:
  kind: Role
  name: flagger-canary-reader
  apiGroup: rbac.authorization.k8s.io