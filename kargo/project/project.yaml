apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo
  namespace: kargo
spec:
  promotionPolicies:
    - stageSelector:
        name: test
      autoPromotionEnabled: true
      autoRollback: {}
    - stageSelector:
        name: uat
      autoPromotionEnabled: false
      autoRollback: {}